<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="ISO-8859-1">
<title>SetList Builder</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
	<nav class="navbar navbar-expand-md bg-dark navbar-dark">
		<a class="navbar-brand ps-3" href="#"><i class="bi bi-music-note-list"></i> SetList Builder</a>

		<button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#collapsibleNavbar">
			<span class="navbar-toggler-icon"></span>
		</button>

		<div class="collapse navbar-collapse" id="collapsibleNavbar">
			<ul class="navbar-nav">
				<li class="nav-item"><a class="nav-link" th:href="@{/musicieni}">Artists</a></li>
				<li class="nav-item"><a class="nav-link" th:href="@{/melodii}">Tracks</a></li>
				<li class="nav-item"><a class="nav-link" th:href="@{/concerte}">Concerts</a></li>
			</ul>
		</div>
	</nav>

	<div class="container">
		<div class="row">
			<h1>Artists List</h1>
		</div>

		<div class="row">
			<div class="col-lg-3">
				<a th:href="@{/musicieni/new}" class="btn btn-primary btn-sm mb-3">Add an Artist</a>
			</div>
		</div>
		<table class="table table-striped table-bordered">
			<thead class="table-dark">
				<tr>
					<th>Artist ID</th>
					<th>Artist Name</th>
					<th>Artist Surname</th>
					<th>Artist Genre</th>
					<th>Actions</th>
				</tr>
			</thead>

			<tbody>
				<tr th:each="musician: ${musicieni}">
					<td th:text="${musician.idmusician}"></td>
					<td th:text="${musician.prenumemusician}"></td>
					<td th:text="${musician.numemusician}"></td>
					<td th:text="${musician.genmusician}"></td>
					<td>
						<a th:href="@{/musicieni/edit/{idmusician}(idmusician=${musician.idmusician})}" class="btn btn-primary"><i class="bi bi-pen"></i> Edit</a>
						<a th:href="@{/musicieni/{idmusician}(idmusician=${musician.idmusician})}" class="btn btn-danger"><i class="bi bi-trash3"></i> Delete</a>
					</td>
				</tr>
			</tbody>

		</table>

	</div>
</body>
</html>
