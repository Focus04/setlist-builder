<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="ISO-8859-1">
	<title>SetList Builder</title>
	<link rel="icon" type="image/svg+xml" href="/music-note-list.svg">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	
	<style>
    body {
    	padding-top: 70px;
        background: linear-gradient(rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0.92)), 
                    url('https://images.unsplash.com/photo-1511379938547-c1f69419868d?auto=format&fit=crop&w=1920&q=80');
        background-size: cover;
        background-attachment: fixed;
        background-position: center;
        min-height: 100vh;
    }
	</style>
</head>
<body>
	<nav class="navbar navbar-expand-md bg-dark navbar-dark fixed-top">
		<a class="navbar-brand ps-3" href="/"><i class="bi bi-music-note-list"></i> SetList Builder</a>

		<div class="collapse navbar-collapse" id="collapsibleNavbar">
			<ul class="navbar-nav">
				<li class="nav-item"><a class="nav-link active" th:href="@{/musicieni}">Artists</a></li>
				<li class="nav-item"><a class="nav-link" th:href="@{/melodii}">Tracks</a></li>
				<li class="nav-item"><a class="nav-link" th:href="@{/concerte}">Concerts</a></li>
			</ul>
		</div>
	</nav>

	<div class="container">
		<div class="row">
			<h1>Artists List</h1>
		</div>

		<div class="row">
			<div class="col-lg-3">
				<a th:href="@{/musicieni/new}" class="btn btn-primary btn-sm mb-3">Add an Artist</a>
			</div>
		</div>
		<table class="table table-striped table-bordered table-hover">
			<thead class="table-dark">
				<tr>
					<th>Artist ID</th>
					<th>Artist Name</th>
					<th>Artist Surname</th>
					<th>Artist Genre</th>
					<th>Actions</th>
				</tr>
			</thead>

			<tbody>
<tr th:each="musician : ${musicieni}" th:onclick="'window.location.href=\'/musicieni/edit/' + ${musician.idmusician} + '\''" style="cursor: pointer">
	<td th:text="${musician.idmusician}"></td>
	<td th:text="${musician.prenumemusician}"></td>
	<td th:text="${musician.numemusician}"></td>
	<td th:text="${musician.genmusician}"></td>
	<td>
		<a th:href="@{/musicieni/delete/{id}(id=${musician.idmusician})}" 
		class="btn btn-danger btn-sm" 
		onclick="return event.stopPropagation();">
			<i class="bi bi-trash3"></i> Delete
		</a>
	</td>
</tr>
			</tbody>

		</table>

	</div>
</body>
</html>
