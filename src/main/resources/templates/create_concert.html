<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="ISO-8859-1">
<title>SetList Builder</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
	<nav class="navbar navbar-expand-md bg-dark navbar-dark">
		<a class="navbar-brand ps-3" href="/"><i class="bi bi-music-note-list"></i> SetList Builder</a>

		<button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#collapsibleNavbar">
			<span class="navbar-toggler-icon"></span>
		</button>

		<div class="collapse navbar-collapse" id="collapsibleNavbar">
			<ul class="navbar-nav">
				<li class="nav-item"><a class="nav-link" th:href="@{/musicieni}">Artists</a></li>
				<li class="nav-item"><a class="nav-link" th:href="@{/melodii}">Tracks</a></li>
				<li class="nav-item"><a class="nav-link" th:href="@{/concerte}">Concerts</a></li>
			</ul>
		</div>
	</nav>
	<br>
	<br>
	<div class="container">
		<div class="row">
			<div class="col-lg-6 col-md-6 col-sm-6 container justify-content-center card">
				<h1 class="text-center">Add a Track to a Concert</h1>
				<div class="card-body">
					<form th:action="@{/concerte}" th:object="${concert}" method="POST">
						<div class="form-group">
							<label>Artist</label>
							<div>
								<select th:field="*{musician}" class="form-select" required>
									<th:block th:each="p : ${totimusicienii}">
										<option th:text="|${p.prenumemusician} ${p.numemusician}|" th:value="${p.idmusician}"></option>
									</th:block>
								</select>
							</div>
						</div>

						<div class="form-group">
							<label>Starting Track</label>
							<div>
								<select th:field="*{melodie}" class="form-select" required>
									<th:block th:each="m : ${toatemelodiile}">
										<option th:text="${m.numemelodie}" th:value="${m.idmelodie}"></option>
									</th:block>
								</select>
							</div>
						</div>

						<div class="form-group">
							<label>Stage</label>
							<input type="text" name="numeconcert" th:field="*{numeconcert}" class="form-control" placeholder="The stage you want to add a track to"/>
						</div>

						<div class="form-group">
							<label>Price (RON)</label>
							<input type="text" name="pretconcert" th:field="*{pretconcert}" class="form-control" placeholder="Price of the concert ticket" />
						</div>
						
						<div class="form-group">
							<label>Start Time</label>
							<input type="time" name="orainceput" th:field="*{orainceput}" class="form-control" placeholder="Start Time of the track" />
						</div>

						<div class="form-group">
							<label>End Time</label>
							<input type="time" name="orafinal" th:field="*{orafinal}" class="form-control" placeholder="End Time of the track" />
						</div>

						<div class="box-footer mt-3">
							<button type="submit" class="btn btn-primary px-4 py-2">Add</button>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
