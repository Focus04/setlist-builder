<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="ISO-8859-1">
	<title>SetList Builder</title>
	<link rel="icon" type="image/svg+xml" href="/music-note-list.svg">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
	
	<style>
    body {
    	padding-top: 70px;
        background: linear-gradient(rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.9)),
        url('https://images.unsplash.com/photo-1501281668745-f7f57925c3b4?auto=format&fit=crop&w=1920&q=80');
        background-size: cover;
        background-attachment: fixed;
        background-position: center;
        min-height: 100vh;
    }
	</style>
</head>
<body>
	<nav class="navbar navbar-expand-md bg-dark navbar-dark fixed-top">
		<a class="navbar-brand ps-3" href="/"><i class="bi bi-music-note-list"></i> SetList Builder</a>

		<button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#collapsibleNavbar">
			<span class="navbar-toggler-icon"></span>
		</button>

		<div class="collapse navbar-collapse" id="collapsibleNavbar">
			<ul class="navbar-nav">
				<li class="nav-item"><a class="nav-link" th:href="@{/musicieni}">Artists</a></li>
				<li class="nav-item"><a class="nav-link" th:href="@{/melodii}">Tracks</a></li>
				<li class="nav-item"><a class="nav-link active" th:href="@{/concerte}">Concerts</a></li>
			</ul>
		</div>
	</nav>

	<div class="container">
		<div class="row">
			<h1>Artist Line Up</h1>
		</div>

		<div class="row">
			<div class="col-lg-3">
				<a th:href="@{/concerte/new}" class="btn btn-primary btn-sm mb-3">Add Concert</a>
			</div>
		</div>
		
		<table class="table table-striped table-bordered table-hover">
			<thead class="table-dark">
				<tr>
					<th>Concert ID</th>
					<th>Artist Name</th>
					<th>Artist Surname</th>
					<th>Starting Track</th>
					<th>Genre</th>
					<th>Stage</th>
					<th>Price (RON)</th>
					<th>Start Time</th>
					<th>End Time</th>
					<th>Actions</th>
				</tr>
			</thead>

			<tbody>
				<tr th:each="concert : ${concerte}" th:onclick="'window.location.href=\'/concerte/edit/' + ${concert.idconcert} + '\''" style="cursor: pointer">
					<td th:text="${concert.idconcert}"></td>
					<td th:text="${concert.musician.prenumemusician}"></td>
					<td th:text="${concert.musician.numemusician}"></td>
					<td th:text="${concert.melodie.numemelodie}"></td>
					<td th:text="${concert.melodie.genmelodie}"></td>
					<td th:text="${concert.numeconcert}"></td>
					<td th:text="${concert.pretconcert}"></td>
					<td th:text="${concert.orainceput}"></td>
					<td th:text="${concert.orafinal}"></td>
					<td>
						<a th:href="@{/concerte/edit/{idconcert}(idconcert=${concert.idconcert})}" class="btn btn-primary"><i class="bi bi-pen"></i> Edit</a>
						<a th:href="@{/concerte/delete/{id}(id=${concert.idconcert})}" class="btn btn-danger btn-sm">Delete</a>
					</td>
				</tr>
			</tbody>
		</table>
	</div>
</body>
</html>
